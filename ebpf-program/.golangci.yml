linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gosec

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning
      - name: unexported-return
        severity: warning
      - name: error-return
        severity: error
      - name: error-naming
        severity: error
      - name: errorf
        severity: error

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
