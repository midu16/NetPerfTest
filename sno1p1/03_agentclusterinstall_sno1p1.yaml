---
apiVersion: extensions.hive.openshift.io/v1beta1
kind: AgentClusterInstall
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: sno1
  namespace: sno1
spec:
  manifestsConfigMapRef:
    name: extra-manifests
  clusterDeploymentRef:
    name: sno1
  imageSetRef:
    name: openshift-v4.18.27-disconnected
  networking:
    networkType: "OVNKubernetes"
    clusterNetwork:
      - cidr: "10.128.0.0/14"
        hostPrefix: 23
    serviceNetwork:
      - "172.30.0.0/16"
    machineNetwork:
      - cidr: "172.16.30.0/24"
  provisionRequirements:
    controlPlaneAgents: 1
    workerAgents: 1  # This should be set to allow worker nodes for scale up the SNO1 cluster
  sshPublicKey: 'ssh-rsa  root@INBACRNRDL0102.workload.bos2.lab'
