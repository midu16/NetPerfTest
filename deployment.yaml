---
apiVersion: v1
kind: Pod
metadata:
  name: cat-1
  namespace: network-tools
  labels:
    app: network-tools
    instance: cat-1
spec:
  hostNetwork: false
  hostPID: true
  nodeSelector:
    kubernetes.io/hostname: hub-ctlplane-0.5g-deployment.lab
  containers:
  - name: network-tools
    image: quay.io/midu/network-tools:latest
    imagePullPolicy: Always
    securityContext:
      privileged: true
      capabilities:
        add:
        - NET_ADMIN
        - NET_RAW
        - SYS_ADMIN
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: "500m"
        memory: 512Mi
    volumeMounts:
    - name: pcaps
      mountPath: /data/pcaps
  volumes:
  - name: pcaps
    emptyDir: {}
  restartPolicy: Always
